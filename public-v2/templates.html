<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Templates - FB Auto Poster Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sidebar { min-height: 100vh; }
        .sidebar-section { cursor: pointer; user-select: none; }
        .sidebar-section:hover { background-color: #374151; }
        .sidebar-section .toggle-icon { transition: transform 0.2s; }
        .sidebar-section.collapsed .toggle-icon { transform: rotate(-90deg); }
        .sidebar-section.collapsed + .sidebar-items { display: none; }
        .sidebar-items a { padding-left: 1.5rem; }
        .img-thumb { cursor: pointer; border: 2px solid transparent; border-radius: 4px; overflow: hidden; transition: all 0.2s; }
        .img-thumb:hover { border-color: #4299e1; }
        .img-thumb.selected { border-color: #48bb78; background-color: #f0fff4; }
        .img-thumb img { width: 100%; height: 60px; object-fit: cover; }
    </style>
</head>
<body class="bg-gray-100">
    <div class="flex">
        <!-- Sidebar -->
        <div class="sidebar w-64 bg-gray-900 text-white fixed">
            <div class="p-6">
                <h1 class="text-xl font-bold"><i class="fab fa-facebook text-blue-500 mr-2"></i>FB Auto Poster</h1>
                <p class="text-xs text-gray-400 mt-1">Pro v2.0</p>
            </div>
            <nav class="mt-6 space-y-1">
                <!-- Overview -->
                <div class="sidebar-section" onclick="toggleSection(this)">
                    <div class="flex items-center justify-between px-6 py-2 text-xs text-gray-400 uppercase tracking-wider">
                        <span>Overview</span>
                        <i class="fas fa-chevron-down toggle-icon text-xs"></i>
                    </div>
                </div>
                <div class="sidebar-items">
                    <a href="index.html" class="block py-2 px-6 hover:bg-gray-800 transition">
                        <i class="fas fa-home w-6"></i> Dashboard
                    </a>
                </div>

                <!-- Data -->
                <div class="sidebar-section" onclick="toggleSection(this)">
                    <div class="flex items-center justify-between px-6 py-2 text-xs text-gray-400 uppercase tracking-wider">
                        <span>Data</span>
                        <i class="fas fa-chevron-down toggle-icon text-xs"></i>
                    </div>
                </div>
                <div class="sidebar-items">
                    <a href="accounts.html" class="block py-2 px-6 hover:bg-gray-800 transition">
                        <i class="fas fa-user-cog w-6"></i> Akun
                    </a>
                    <a href="groups.html" class="block py-2 px-6 hover:bg-gray-800 transition">
                        <i class="fas fa-users w-6"></i> Grup
                    </a>
                </div>

                <!-- Posting -->
                <div class="sidebar-section" onclick="toggleSection(this)">
                    <div class="flex items-center justify-between px-6 py-2 text-xs text-gray-400 uppercase tracking-wider">
                        <span>Posting</span>
                        <i class="fas fa-chevron-down toggle-icon text-xs"></i>
                    </div>
                </div>
                <div class="sidebar-items">
                    <a href="post.html" class="block py-2 px-6 hover:bg-gray-800 transition">
                        <i class="fas fa-paper-plane w-6"></i> Post Sekarang
                    </a>
                    <a href="scheduled.html" class="block py-2 px-6 hover:bg-gray-800 transition">
                        <i class="fas fa-clock w-6"></i> Jadwal
                    </a>
                    <a href="templates.html" class="block py-2 px-6 bg-blue-600">
                        <i class="fas fa-copy w-6"></i> Template
                    </a>
                </div>
                
                <!-- Auto Join -->
                <div class="sidebar-section" onclick="toggleSection(this)">
                    <div class="flex items-center justify-between px-6 py-2 text-xs text-gray-400 uppercase tracking-wider">
                        <span>Auto Join</span>
                        <i class="fas fa-chevron-down toggle-icon text-xs"></i>
                    </div>
                </div>
                <div class="sidebar-items">
                    <a href="join-groups.html" class="block py-2 px-6 hover:bg-gray-800 transition">
                        <i class="fas fa-user-plus w-6"></i> Auto Join Grup
                    </a>
                </div>

                <!-- Monitor -->
                <div class="sidebar-section" onclick="toggleSection(this)">
                    <div class="flex items-center justify-between px-6 py-2 text-xs text-gray-400 uppercase tracking-wider">
                        <span>Monitor</span>
                        <i class="fas fa-chevron-down toggle-icon text-xs"></i>
                    </div>
                </div>
                <div class="sidebar-items">
                    <a href="history.html" class="block py-2 px-6 hover:bg-gray-800 transition">
                        <i class="fas fa-history w-6"></i> Riwayat
                    </a>
                </div>

                <!-- System -->
                <div class="sidebar-section" onclick="toggleSection(this)">
                    <div class="flex items-center justify-between px-6 py-2 text-xs text-gray-400 uppercase tracking-wider">
                        <span>System</span>
                        <i class="fas fa-chevron-down toggle-icon text-xs"></i>
                    </div>
                </div>
                <div class="sidebar-items">
                    <a href="settings.html" class="block py-2 px-6 hover:bg-gray-800 transition">
                        <i class="fas fa-cog w-6"></i> Pengaturan
                    </a>
                </div>
            </nav>
        </div>

        <!-- Main Content -->
        <div class="flex-1 ml-64 p-8">
            <!-- Header -->
            <div class="mb-8">
                <h2 class="text-2xl font-bold text-gray-800">Post Templates</h2>
                <p class="text-gray-600">Kelola template posting untuk digunakan di Post Sekarang dan Jadwal</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Create/Edit Template Form - Left Panel (match post.html) -->
                <div class="bg-white rounded-lg shadow p-6">
                    <h3 class="text-lg font-semibold mb-4" id="formTitle">Template Baru</h3>

                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Nama Template *</label>
                            <input type="text" id="templateName" class="w-full border rounded-lg px-3 py-2" placeholder="Contoh: Promo Lowongan">
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2">Kategori</label>
                            <select id="templateCategory" class="w-full border rounded-lg px-3 py-2">
                                <option value="general">Umum</option>
                                <option value="promo">Promosi</option>
                                <option value="info">Informasi</option>
                                <option value="loker">Lowongan</option>
                                <option value="product">Produk</option>
                                <option value="event">Event</option>
                                <option value="other">Lainnya</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2">Isi Teks <span class="text-gray-400 font-normal">(opsional)</span></label>
                            <textarea id="templateContent" rows="5" class="w-full border rounded-lg px-3 py-2"
                                      placeholder="Tulis konten posting..."></textarea>
                        </div>

                        <!-- Gallery Gambar -->
                        <div>
                            <label class="block text-sm font-medium mb-2">Gambar (opsional)</label>
                            <div id="templateImgGallery" class="grid grid-cols-4 gap-2 max-h-48 overflow-y-auto bg-gray-50 rounded-lg p-2">
                                <p class="text-gray-400 text-sm col-span-4 text-center py-4"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat...</p>
                            </div>
                            <div id="templateGalleryPreview" class="flex flex-wrap gap-2 mt-2"></div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2">URL Link <span class="text-gray-400 font-normal">(opsional)</span></label>
                            <input type="url" id="templateLinkUrl" class="w-full border rounded-lg px-3 py-2" placeholder="https://example.com">
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium mb-2">Delay (detik)</label>
                                <input type="number" id="templateDelay" class="w-full border rounded-lg px-3 py-2" value="120" min="30">
                            </div>
                            <div class="flex items-center pt-6">
                                <input type="checkbox" id="templateVariableDelay" class="mr-2" checked>
                                <label class="text-sm">Variable Delay</label>
                            </div>
                        </div>
                    </div>

                    <div class="mt-6 flex gap-3">
                        <button onclick="saveTemplate()" class="flex-1 bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 font-semibold">
                            <i class="fas fa-save mr-2"></i>Simpan Template
                        </button>
                        <button onclick="clearForm()" class="px-4 py-3 border rounded-lg hover:bg-gray-100">
                            <i class="fas fa-undo mr-2"></i>Reset
                        </button>
                    </div>
                </div>

                <!-- Templates List - Right Panel -->
                <div class="bg-white rounded-lg shadow p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-semibold">Daftar Template</h3>
                        <div class="relative">
                            <input type="text" id="searchInput" placeholder="Cari..."
                                   class="border rounded-lg px-3 py-2 pl-9 w-40" onkeyup="searchTemplates()">
                            <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                        </div>
                    </div>

                    <div class="mb-4 flex flex-wrap gap-2">
                        <select id="categoryFilter" onchange="loadTemplates()" class="border rounded-lg px-3 py-2 text-sm">
                            <option value="">Semua</option>
                            <option value="general">Umum</option>
                            <option value="promo">Promosi</option>
                            <option value="info">Informasi</option>
                            <option value="loker">Lowongan</option>
                            <option value="product">Produk</option>
                            <option value="event">Event</option>
                        </select>
                    </div>

                    <div id="templatesList" class="space-y-3 max-h-[500px] overflow-y-auto">
                        <p class="text-gray-500 text-center py-8">
                            <i class="fas fa-spinner fa-spin mr-2"></i>Memuat...
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSection(header) {
            header.classList.toggle('collapsed');
            const items = header.nextElementSibling;
            if (items && items.classList.contains('sidebar-items')) {
                items.style.display = items.style.display === 'none' ? '' : 'none';
            }
        }

        let templates = [];
        let currentEditId = null;
        let templateSelectedImages = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadTemplates();
            loadTemplateImageGallery();
        });

        async function loadTemplateImageGallery() {
            const gallery = document.getElementById('templateImgGallery');
            if (!gallery) return;
            gallery.innerHTML = '<p class="text-gray-400 text-sm col-span-4 text-center py-4"><i class="fas fa-spinner fa-spin mr-2"></i>Memuat...</p>';
            try {
                const res = await fetch('/api/uploads-images');
                const data = await res.json();
                if (data.images && data.images.length > 0) {
                    gallery.innerHTML = data.images.map(img =>
                        '<div class="img-thumb' + (templateSelectedImages.includes(img.path) ? ' selected' : '') + '" onclick="toggleTemplateImg(this,\'' + img.path + '\')">' +
                        '<img src="' + img.path + '" alt="' + img.name + '" onerror="this.parentElement.style.display=\'none\'">' +
                        '<div class="text-xs text-center truncate p-1 bg-gray-50">' + img.name + '</div></div>'
                    ).join('');
                } else {
                    gallery.innerHTML = '<p class="text-gray-400 text-sm col-span-4 text-center py-4">Tidak ada gambar</p>';
                }
            } catch (e) {
                gallery.innerHTML = '<p class="text-red-400 text-sm col-span-4 text-center py-4">Gagal memuat</p>';
            }
        }

        function toggleTemplateImg(el, path) {
            el.classList.toggle('selected');
            if (templateSelectedImages.includes(path)) {
                templateSelectedImages = templateSelectedImages.filter(p => p !== path);
            } else {
                templateSelectedImages.push(path);
            }
            updateTemplateGalleryPreview();
        }

        function updateTemplateGalleryPreview() {
            const preview = document.getElementById('templateGalleryPreview');
            if (!preview) return;
            preview.innerHTML = '';
            templateSelectedImages.forEach(path => {
                const div = document.createElement('div');
                div.className = 'relative';
                div.innerHTML = '<img src="' + path + '" class="w-16 h-16 object-cover rounded" style="height:60px;object-fit:cover;">' +
                    '<button onclick="removeTemplateImg(this,\'' + path + '\')" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-5 h-5 text-xs flex items-center justify-center">×</button>';
                preview.appendChild(div);
            });
        }

        function removeTemplateImg(btn, path) {
            btn.parentElement.remove();
            templateSelectedImages = templateSelectedImages.filter(p => p !== path);
            document.querySelectorAll('#templateImgGallery .img-thumb').forEach(thumb => {
                const img = thumb.querySelector('img');
                if (img && img.src.includes(path)) thumb.classList.remove('selected');
            });
        }

        async function loadTemplates() {
            try {
                const params = new URLSearchParams();
                const categoryEl = document.getElementById('categoryFilter');
                const category = categoryEl ? categoryEl.value : '';

                if (category) params.append('category', category);

                const response = await fetch(`/api/templates?${params}`);
                const data = await response.json();

                if (data.success) {
                    templates = data.templates;
                    renderTemplatesList();
                }
            } catch (error) {
                console.error('Error loading templates:', error);
                document.getElementById('templatesList').innerHTML = '<p class="text-red-500 text-center py-4">Gagal memuat template</p>';
            }
        }

        function renderTemplatesList() {
            const list = document.getElementById('templatesList');

            if (templates.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-file-alt text-4xl text-gray-300 mb-3"></i>
                        <p>Belum ada template</p>
                        <p class="text-sm text-gray-400">Buat template pertama di form sebelah</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = templates.map(template => `
                <div class="border rounded-lg p-4 hover:bg-gray-50 transition">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-xs px-2 py-1 rounded bg-blue-100 text-blue-800">${template.category}</span>
                            </div>
                            <h4 class="font-semibold text-gray-800">${template.name}</h4>
                            <p class="text-sm text-gray-500 mt-1 line-clamp-2">${template.content || '(No content)'}</p>
                            ${template.link_url ? `<p class="text-xs text-blue-600 mt-1 truncate"><i class="fas fa-link mr-1"></i>${template.link_url}</p>` : ''}
                            ${template.image_paths ? `<p class="text-xs text-gray-500 mt-1"><i class="fas fa-image mr-1"></i>${JSON.parse(template.image_paths).length} gambar</p>` : ''}
                            <p class="text-xs text-gray-400 mt-2">${template.use_count || 0}x digunakan</p>
                        </div>
                        <div class="flex gap-2 ml-3">
                            <button onclick="loadTemplateForEdit(${template.id})" class="text-blue-600 hover:text-blue-800 p-1" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteTemplate(${template.id})" class="text-red-600 hover:text-red-800 p-1" title="Hapus">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function searchTemplates() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = templates.filter(t =>
                t.name.toLowerCase().includes(search) ||
                (t.content && t.content.toLowerCase().includes(search))
            );

            const list = document.getElementById('templatesList');

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-8 text-gray-500">
                        <i class="fas fa-search text-4xl text-gray-300 mb-3"></i>
                        <p>Tidak ada template yang cocok</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(template => `
                <div class="border rounded-lg p-4 hover:bg-gray-50 transition">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="text-xs px-2 py-1 rounded bg-blue-100 text-blue-800">${template.category}</span>
                            </div>
                            <h4 class="font-semibold text-gray-800">${template.name}</h4>
                            <p class="text-sm text-gray-500 mt-1 line-clamp-2">${template.content || '(No content)'}</p>
                            <p class="text-xs text-gray-400 mt-2">${template.use_count || 0}x digunakan</p>
                        </div>
                        <div class="flex gap-2 ml-3">
                            <button onclick="loadTemplateForEdit(${template.id})" class="text-blue-600 hover:text-blue-800 p-1" title="Edit">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="deleteTemplate(${template.id})" class="text-red-600 hover:text-red-800 p-1" title="Hapus">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function clearForm() {
            document.getElementById('templateName').value = '';
            document.getElementById('templateCategory').value = 'general';
            document.getElementById('templateContent').value = '';
            document.getElementById('templateLinkUrl').value = '';
            document.getElementById('templateDelay').value = '120';
            document.getElementById('templateVariableDelay').checked = true;
            document.getElementById('formTitle').textContent = 'Template Baru';
            currentEditId = null;
            templateSelectedImages = [];
            updateTemplateGalleryPreview();
            loadTemplateImageGallery();
        }

        async function saveTemplate() {
            const name = document.getElementById('templateName').value.trim();
            if (!name) {
                alert('Nama template wajib diisi');
                return;
            }

            const templateData = {
                name: name,
                category: document.getElementById('templateCategory').value,
                content: document.getElementById('templateContent').value,
                link_url: document.getElementById('templateLinkUrl').value || null,
                image_paths: templateSelectedImages,
                delay_seconds: parseInt(document.getElementById('templateDelay').value) || 120,
                use_variable_delay: document.getElementById('templateVariableDelay').checked
            };

            const url = currentEditId ? `/api/templates/${currentEditId}` : '/api/templates';
            const method = currentEditId ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(templateData)
                });

                const data = await response.json();
                if (data.success) {
                    alert(currentEditId ? 'Template berhasil diupdate!' : 'Template berhasil disimpan!');
                    clearForm();
                    loadTemplates();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }

        async function loadTemplateForEdit(id) {
            try {
                const response = await fetch(`/api/templates/${id}`);
                const data = await response.json();

                if (data.success) {
                    const t = data.template;
                    currentEditId = t.id;
                    document.getElementById('templateName').value = t.name;
                    document.getElementById('templateCategory').value = t.category || 'general';
                    document.getElementById('templateContent').value = t.content || '';
                    document.getElementById('templateLinkUrl').value = t.link_url || '';
                    document.getElementById('templateDelay').value = t.delay_seconds || 120;
                    document.getElementById('templateVariableDelay').checked = t.use_variable_delay !== false;
                    document.getElementById('formTitle').textContent = 'Edit Template';

                    templateSelectedImages = t.image_paths ? JSON.parse(t.image_paths) : [];
                    updateTemplateGalleryPreview();
                    loadTemplateImageGallery();

                    document.querySelector('.bg-white.rounded-lg.shadow.p-6').scrollIntoView({ behavior: 'smooth' });
                }
            } catch (error) {
                alert('Error loading template: ' + error.message);
            }
        }

        async function deleteTemplate(id) {
            if (!confirm('Yakin ingin menghapus template ini?')) return;

            try {
                const response = await fetch(`/api/templates/${id}`, { method: 'DELETE' });
                const data = await response.json();

                if (data.success) {
                    loadTemplates();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        }
    </script>
</body>
</html>
